name: POS Quality Gates

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, tests, device contracts, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run typecheck
      - name: Unit and regression tests
        run: npm test
      - name: Device integration contracts
        run: npm run test:device-contracts
      - name: Production build
        run: npm run build
