name: Build Windows Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Tayba POS Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -Filter *.exe -File

          if ($files.Count -eq 0) {
            Write-Error "No Windows installer was generated."
            exit 1
          }

          Write-Host "Windows installer generated successfully:"
          $files | Select-Object Name, Length, FullName

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayba-pos-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
