name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Tayba POS Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add or Sync Capacitor Android
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "Android project incomplete or missing, recreating it..."
            rm -rf android
            npx cap add android
          else
            echo "Android project exists, syncing..."
            npx cap sync android
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \n\r\t' | base64 -d > android/app/tayba-release-key.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=tayba-release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Configure release signing in build.gradle
        run: |
          python3 << 'EOF'
          import re

          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      def keystorePropertiesFile = rootProject.file("keystore.properties")
                      def keystoreProperties = new Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
          '''

          content = content.replace("android {", "android {\n" + signing_block, 1)
          content = re.sub(r"(release\s*\{)", r"\1\n            signingConfig signingConfigs.release", content, count=1)

          with open(path, "w") as f:
              f.write(content)

          print("---- Patched build.gradle ----")
          print(content)
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayba-pos-release-apk-signed
          path: android/app/build/outputs/apk/release/*.apk