name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Tayba POS Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add or Sync Capacitor Android
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "Android project incomplete or missing, recreating it..."
            rm -rf android
            npx cap add android
          else
            echo "Android project exists, syncing..."
          fi

          npx cap sync android
          npx capacitor-assets generate --android
          npx cap sync android
          node scripts/force-android-launcher-icon.mjs

      - name: Verify Tayba launcher resources
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          ! find android/app/src/main/res -type f -name 'ic_launcher*.xml' | grep -q .
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          echo "Tayba launcher icon resources verified."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode and Verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD secret is empty."
            exit 1
          }

          echo "$KEYSTORE_BASE64" \
            | tr -d ' \n\r\t' \
            | base64 --decode \
            > android/app/tayba-release-key.jks

          test -s android/app/tayba-release-key.jks || {
            echo "ERROR: Decoded keystore file is empty."
            exit 1
          }

          echo "Checking keystore format..."

          keytool -list \
            -keystore android/app/tayba-release-key.jks \
            -storepass "$KEYSTORE_PASSWORD"

          echo "Keystore is valid."

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=tayba-release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure release signing in build.gradle
        run: |
          python3 << 'EOF'
          path = "android/app/build.gradle"

          with open(path, "r") as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      def keystorePropertiesFile = rootProject.file("keystore.properties")
                      def keystoreProperties = new Properties()

                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
          '''

          # Insert signingConfigs block right after "android {"
          content = content.replace(
              "android {",
              "android {\n" + signing_block,
              1
          )

          # Find buildTypes block specifically
          marker = "buildTypes {"
          idx = content.index(marker)

          before = content[:idx]
          after = content[idx:]

          # Add signingConfig only to the release build type
          after = after.replace(
              "release {",
              "release {\n            signingConfig signingConfigs.release",
              1
          )

          content = before + after

          with open(path, "w") as f:
              f.write(content)

          print("---- Patched build.gradle ----")
          print(content)
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayba-pos-release-apk-signed
          path: android/app/build/outputs/apk/release/*.apk