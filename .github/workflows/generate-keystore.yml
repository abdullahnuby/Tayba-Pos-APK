name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore tayba-release-key.jks \
            -alias tayba-pos-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "TaybaPOS@2026!" \
            -keypass "TaybaPOS@2026!" \
            -dname "CN=Tayba POS, OU=Trust ES, O=Tayba POS, L=Luxor, ST=Luxor, C=EG"

      - name: Convert to base64
        run: base64 -w 0 tayba-release-key.jks > keystore-base64.txt

      - name: Print base64 (copy this)
        run: cat keystore-base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayba-release-keystore
          path: |
            tayba-release-key.jks
            keystore-base64.txt